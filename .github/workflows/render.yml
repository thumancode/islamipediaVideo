name: Render app video

# Actions tab → "Render app video" → Run workflow
# When it finishes, download the "app-video" zip from the Artifacts section of the run page.
# Output is exported in 4K portrait (2160x3840) by default.
on:
  workflow_dispatch:
    inputs:
      test_seconds:
        description: "Test only: render the first N seconds (leave empty for the full video)"
        required: false
        default: ""
      workers:
        description: "Parallel browsers (empty = auto)"
        required: false
        default: ""
      resolution:
        description: "Output resolution (4k = 2160x3840, 1080p = 1080x1920)"
        required: false
        default: "4k"
        type: choice
        options:
          - "4k"
          - "1080p"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # 4K rendering takes longer than 1080p
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-hosny-amiri fonts-freefont-ttf fonts-dejavu-core
          fc-cache -f

      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Render video
        env:
          TEST_SECONDS: ${{ github.event.inputs.test_seconds }}
          WORKERS: ${{ github.event.inputs.workers }}
          RESOLUTION: ${{ github.event.inputs.resolution }}
        run: |
          ARGS="--res ${RESOLUTION:-4k}"
          if [ -n "$TEST_SECONDS" ]; then ARGS="$ARGS --test $TEST_SECONDS"; fi
          if [ -n "$WORKERS" ]; then ARGS="$ARGS --workers $WORKERS"; fi
          node render.js $ARGS

      - name: Verify output resolution
        run: |
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate,codec_name \
            -of default=nw=1 app-video.mp4
          ls -lh app-video.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: app-video
          path: app-video.mp4
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
